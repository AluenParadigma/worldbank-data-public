name: World Bank API Probe

on:
  workflow_dispatch:

jobs:
  probe-worldbank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run World Bank API probe
        run: |
          python worldbank_probe.py
