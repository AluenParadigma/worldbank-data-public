name: World Bank Daily Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "55 10 * * *"

permissions:
  contents: write

jobs:
  fetch-worldbank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download World Bank procurement notices
        run: |
          python worldbank_fetch.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          metadata_path = Path("data/metadata.json")
          json_path = Path("data/latest.json")
          csv_path = Path("data/latest.csv")

          # ---------------------------------------------------------
          # 1. Verificar archivos
          # ---------------------------------------------------------

          for path in [
              metadata_path,
              json_path,
              csv_path,
          ]:
              if not path.exists():
                  raise SystemExit(
                      f"ERROR: falta archivo {path}"
                  )

          # ---------------------------------------------------------
          # 2. Leer metadata
          # ---------------------------------------------------------

          with metadata_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              metadata = json.load(f)

          # ---------------------------------------------------------
          # 3. Leer JSON
          # ---------------------------------------------------------

          with json_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              payload = json.load(f)

          if "data" not in payload:
              raise SystemExit(
                  "ERROR: latest.json no contiene data"
              )

          if not isinstance(payload["data"], list):
              raise SystemExit(
                  "ERROR: latest.json.data no es una lista"
              )

          json_records = len(payload["data"])

          # ---------------------------------------------------------
          # 4. Leer CSV
          # ---------------------------------------------------------

          with csv_path.open(
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              rows = list(csv.reader(f))

          if not rows:
              raise SystemExit(
                  "ERROR: latest.csv esta vacio"
              )

          csv_records = len(rows) - 1

          # ---------------------------------------------------------
          # 5. Campos metadata
          # ---------------------------------------------------------

          expected = metadata.get(
              "current_consulting_en_es"
          )

          metadata_json_records = metadata.get(
              "json_records"
          )

          metadata_csv_records = metadata.get(
              "csv_records"
          )

          coverage_complete = metadata.get(
              "coverage_complete"
          )

          validation_status = metadata.get(
              "validation_status"
          )

          language_controls = metadata.get(
              "language_controls",
              []
          )

          historical_filtered_unique = metadata.get(
              "historical_filtered_unique"
          )

          expired_records = metadata.get(
              "expired_records"
          )

          records_without_deadline = metadata.get(
              "records_without_deadline"
          )

          inactive_status_records = metadata.get(
              "inactive_status_records"
          )

          # ---------------------------------------------------------
          # 6. Mostrar controles
          # ---------------------------------------------------------

          print("")
          print("==========================================")
          print("WORLD BANK FILE VALIDATION")
          print("==========================================")

          for control in language_controls:
              language = control.get(
                  "language_filter"
              )

              api_total = control.get(
                  "api_total"
              )

              downloaded = control.get(
                  "records_downloaded"
              )

              duplicates = control.get(
                  "duplicate_records",
                  0
              )

              recovery = control.get(
                  "recovery_passes",
                  0
              )

              complete = control.get(
                  "coverage_complete"
              )

              print(
                  f"{language}: "
                  f"{downloaded}/{api_total} | "
                  f"duplicates={duplicates} | "
                  f"recovery={recovery} | "
                  f"complete={complete}"
              )

          print(
              f"Historical filtered unique: {historical_filtered_unique}"
          )

          print(
              f"Expired records:             {expired_records}"
          )

          print(
              f"Records without deadline:    {records_without_deadline}"
          )

          print(
              f"Inactive status records:     {inactive_status_records}"
          )

          print(
              f"Expected current records:    {expected}"
          )

          print(
              f"Metadata JSON records:       {metadata_json_records}"
          )

          print(
              f"Actual JSON records:         {json_records}"
          )

          print(
              f"Metadata CSV records:        {metadata_csv_records}"
          )

          print(
              f"Actual CSV records:          {csv_records}"
          )

          print(
              f"Coverage complete:           {coverage_complete}"
          )

          print(
              f"Validation status:           {validation_status}"
          )

          print("==========================================")

          # ---------------------------------------------------------
          # 7. Validar campos obligatorios
          # ---------------------------------------------------------

          required_fields = [
              "current_consulting_en_es",
              "json_records",
              "csv_records",
              "coverage_complete",
              "validation_status",
              "language_controls",
              "historical_filtered_unique",
              "expired_records",
              "records_without_deadline",
              "inactive_status_records",
          ]

          for field in required_fields:
              if field not in metadata:
                  raise SystemExit(
                      f"ERROR: metadata no contiene {field}"
                  )

          # ---------------------------------------------------------
          # 8. Validar cada universo por idioma
          # ---------------------------------------------------------

          if not language_controls:
              raise SystemExit(
                  "ERROR: language_controls esta vacio"
              )

          for control in language_controls:

              language = control.get(
                  "language_filter"
              )

              api_total = control.get(
                  "api_total"
              )

              downloaded = control.get(
                  "records_downloaded"
              )

              complete = control.get(
                  "coverage_complete"
              )

              if api_total is None:
                  raise SystemExit(
                      f"ERROR: {language} sin api_total"
                  )

              if downloaded is None:
                  raise SystemExit(
                      f"ERROR: {language} sin records_downloaded"
                  )

              if downloaded != api_total:
                  raise SystemExit(
                      f"ERROR DE COBERTURA {language}: "
                      f"{downloaded} != {api_total}"
                  )

              if complete is not True:
                  raise SystemExit(
                      f"ERROR: cobertura incompleta para {language}"
                  )

          # ---------------------------------------------------------
          # 9. Validar registros finales
          # ---------------------------------------------------------

          if expected is None:
              raise SystemExit(
                  "ERROR: current_consulting_en_es es None"
              )

          if expected != json_records:
              raise SystemExit(
                  f"ERROR: current_consulting_en_es "
                  f"({expected}) != JSON ({json_records})"
              )

          if expected != csv_records:
              raise SystemExit(
                  f"ERROR: current_consulting_en_es "
                  f"({expected}) != CSV ({csv_records})"
              )

          if metadata_json_records != json_records:
              raise SystemExit(
                  "ERROR: metadata json_records != JSON real"
              )

          if metadata_csv_records != csv_records:
              raise SystemExit(
                  "ERROR: metadata csv_records != CSV real"
              )

          if coverage_complete is not True:
              raise SystemExit(
                  "ERROR: coverage_complete != true"
              )

          if validation_status != "OK":
              raise SystemExit(
                  "ERROR: validation_status != OK"
              )

          # ---------------------------------------------------------
          # 10. Resultado
          # ---------------------------------------------------------

          print("")
          print("==========================================")
          print("WORLD BANK VALIDATION SUCCESS")
          print("==========================================")
          print(
              f"CURRENT CONSULTING EN/ES: "
              f"{expected}/{expected}"
          )
          print("COVERAGE COMPLETE: TRUE")
          print("VALIDATION STATUS: OK")
          print("==========================================")
          PY

      - name: Show metadata
        run: |
          echo "=========================================="
          echo "data/metadata.json"
          echo "=========================================="
          cat data/metadata.json

      - name: Save daily history
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          mkdir -p history

          cp data/latest.json \
            "history/${DATE}.json"

          cp data/latest.csv \
            "history/${DATE}.csv"

          cp data/metadata.json \
            "history/${DATE}-metadata.json"

          echo "Historical snapshot saved for ${DATE}"

      - name: Commit results
        run: |
          git config user.name "worldbank-monitor"
          git config user.email "worldbank-monitor@users.noreply.github.com"

          git add data/
          git add history/

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Update World Bank procurement data $(date -u '+%Y-%m-%d %H:%M UTC')"

          git push
