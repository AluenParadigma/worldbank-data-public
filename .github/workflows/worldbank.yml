name: World Bank Daily Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "55 10 * * *"

permissions:
  contents: write

jobs:
  fetch-worldbank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download World Bank procurement notices
        run: |
          python worldbank_fetch.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          metadata_path = Path("data/metadata.json")
          json_path = Path("data/latest.json")
          csv_path = Path("data/latest.csv")

          for path in [
              metadata_path,
              json_path,
              csv_path,
          ]:
              if not path.exists():
                  raise SystemExit(
                      f"ERROR: falta archivo {path}"
                  )

          with metadata_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              metadata = json.load(f)

          with json_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              payload = json.load(f)

          with csv_path.open(
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              rows = list(csv.reader(f))

          csv_records = len(rows) - 1
          json_records = len(payload["data"])

          expected = metadata[
              "current_consulting_en_es"
          ]

          print(
              f"Expected current records: {expected}"
          )
          print(
              f"JSON records: {json_records}"
          )
          print(
              f"CSV records: {csv_records}"
          )

          if expected != json_records:
              raise SystemExit(
                  "ERROR: metadata != JSON"
              )

          if expected != csv_records:
              raise SystemExit(
                  "ERROR: metadata != CSV"
              )

          if (
              metadata[
                  "historical_records_downloaded"
              ]
              !=
              metadata[
                  "api_historical_total"
              ]
          ):
              raise SystemExit(
                  "ERROR: historical coverage incomplete"
              )

          if (
              metadata[
                  "historical_coverage_complete"
              ]
              is not True
          ):
              raise SystemExit(
                  "ERROR: historical coverage false"
              )

          if (
              metadata[
                  "current_coverage_complete"
              ]
              is not True
          ):
              raise SystemExit(
                  "ERROR: current coverage false"
              )

          if (
              metadata["validation_status"]
              != "OK"
          ):
              raise SystemExit(
                  "ERROR: validation status not OK"
              )

          print("")
          print(
              f"FINAL WORLD BANK COVERAGE: "
              f"{expected}/{expected} - 100%"
          )
          print(
              "VALIDATION STATUS: OK"
          )
          PY

      - name: Show metadata
        run: |
          cat data/metadata.json

      - name: Save daily history
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          mkdir -p history

          cp data/latest.json \
            "history/${DATE}.json"

          cp data/latest.csv \
            "history/${DATE}.csv"

          cp data/metadata.json \
            "history/${DATE}-metadata.json"

      - name: Commit results
        run: |
          git config \
            user.name \
            "worldbank-monitor"

          git config \
            user.email \
            "worldbank-monitor@users.noreply.github.com"

          git add data/
          git add history/

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit \
            -m "Update World Bank procurement data"

          git push
